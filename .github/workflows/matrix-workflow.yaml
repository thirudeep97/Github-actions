name: dockerwindows-ubuntu

on:
  push:
  workflow_dispatch:

jobs:
    Deploy-on-ubuntu:
        strategy:
            fail-fast: false
            max-parallel: 2
          matrix:
            os: [ubuntu-latest, ubuntu-20.04, windows-latest]
            images: [hello-world, alpine]
            exculde:
              - images: alpine
                os: windows-latest
            inculde:
              - images: amde64/alpine
                os: ubuntu-20.04
        runs-on: ${{ matrix.os }}
        steps:
        - name: Echo Docker Details
          run: docker info
        
        - name: Docker run on the ${{ matrix.images }}
          run: docker run ${{ matrix.images }}
