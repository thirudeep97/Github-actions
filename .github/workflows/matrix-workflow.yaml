 name: docker-on-windows-ubuntu

 on:
  push:
  workflow_dispatch:

jobs:
    Deploy-on-ubuntu:
        runs-on: ubuntu-latest
        steps:
        - name: Echo Docker Details
          run: docker info
        
        - name: Run Images
          run: docker run hello-world
    Deploy-on-windows:
        runs-on: windows-latest
        steps:
        - name: Echo Docker Details
          run: docker info
        
        - name: Run Images
          run: docker run hello-world

